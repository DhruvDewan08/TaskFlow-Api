<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Task Management API</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/fanta.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <section id="auth">
        <div>
            <h2>Login</h2>
            <p>Create an account to manage your tasks</p>
        </div>

        <p id="error" style="display: none;"></p>
        <input id="usernameInput" placeholder="Username" style="display: none;" />
        <input id="emailInput" placeholder="Email" />
        <input id="passwordInput" placeholder="Password" type="password" />
        <button id="authBtn" onclick="authenticate()">Submit</button>
        <hr />
        <div class="register-content">
            <p>Don't have an account?</p>
            <button onclick="toggleIsRegister()" id="registerBtn">Sign up</button>
        </div>
    </section>

    <header style="display: none;">
        <h1 class="text-gradient">You have 0 open tasks.</h1>
        <button onclick="logout()" style="margin-left: auto;">Logout</button>
    </header>

    <nav style="display: none;" class="tab-container">
        <button onclick="changeTab('All')" class="tab-button selected-tab">
            <h4>All <span>(0)</span></h4>
        </button>
        <button onclick="changeTab('Open')" class="tab-button">
            <h4>Open <span>(0)</span></h4>
        </button>
        <button onclick="changeTab('Complete')" class="tab-button">
            <h4>Complete <span>(0)</span></h4>
        </button>
        <hr />
    </nav>

    <main style="display: none;"></main>
</body>

<script>
    let accessToken = localStorage.getItem('accessToken')
    let refreshToken = localStorage.getItem('refreshToken')

    let isLoading = false
    let isAuthenticating = false
    let isRegistration = false
    let selectedTab = 'All'
    let tasks = []

    const apiBase = '/'

    const nav = document.querySelector('nav')
    const header = document.querySelector('header')
    const main = document.querySelector('main')
    const navElements = document.querySelectorAll('.tab-button')
    const authContent = document.getElementById('auth')
    const textError = document.getElementById('error')
    const usernameInput = document.getElementById('usernameInput')
    const email = document.getElementById('emailInput')
    const password = document.getElementById('passwordInput')
    const registerBtn = document.getElementById('registerBtn')
    const authBtn = document.getElementById('authBtn')

    async function apiFetch(url, options = {}) {
        const headers = { ...(options.headers || {}) }
        if (accessToken) {
            headers['Authorization'] = `Bearer ${accessToken}`
        }

        let response = await fetch(apiBase + url, { ...options, headers })

        if (response.status === 401 && refreshToken && !url.includes('auth/')) {
            const refreshRes = await fetch(apiBase + 'auth/refresh', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refreshToken }),
            })

            if (refreshRes.ok) {
                const tokens = await refreshRes.json()
                accessToken = tokens.accessToken
                refreshToken = tokens.refreshToken
                localStorage.setItem('accessToken', accessToken)
                localStorage.setItem('refreshToken', refreshToken)

                headers['Authorization'] = `Bearer ${accessToken}`
                response = await fetch(apiBase + url, { ...options, headers })
            } else {
                logout()
                return response
            }
        }

        return response
    }

    async function showDashboard() {
        nav.style.display = 'block'
        header.style.display = 'flex'
        main.style.display = 'flex'
        authContent.style.display = 'none'
        await fetchTasks()
    }

    function updateHeaderText() {
        const openCount = tasks.filter(t => !t.completed).length
        header.querySelector('h1').innerText =
            openCount === 1 ? 'You have 1 open task.' : `You have ${openCount} open tasks.`
    }

    function updateNavCount() {
        navElements.forEach(ele => {
            const btnText = ele.innerText.split(' ')[0]
            const count = tasks.filter(val => {
                if (btnText === 'All') return true
                return btnText === 'Complete' ? val.completed : !val.completed
            }).length
            ele.querySelector('span').innerText = `(${count})`
        })
    }

    function changeTab(tab) {
        selectedTab = tab
        navElements.forEach(val => {
            if (val.innerText.includes(tab)) {
                val.classList.add('selected-tab')
            } else {
                val.classList.remove('selected-tab')
            }
        })
        renderTasks()
    }

    function priorityBadge(priority) {
        return `<span class="priority-badge priority-${priority.toLowerCase()}">${priority}</span>`
    }

    function renderTasks() {
        updateNavCount()
        updateHeaderText()

        let taskList = ''
        tasks.filter(val => {
            return selectedTab === 'All' ? true : selectedTab === 'Complete' ? val.completed : !val.completed
        }).forEach(task => {
            const dueDate = task.dueDate ? new Date(task.dueDate).toLocaleDateString() : ''
            taskList += `
            <div class="card todo-item">
                <div>
                    <p><strong>${task.title}</strong> ${priorityBadge(task.priority)}</p>
                    ${task.description ? `<p style="opacity:0.7;font-size:0.9em;">${task.description}</p>` : ''}
                    ${dueDate ? `<p style="font-size:0.8em;">Due: ${dueDate}</p>` : ''}
                </div>
                <div class="todo-buttons">
                    <button onclick="updateTask(${task.id})" ${task.completed ? 'disabled' : ''}>
                        <h6>Done</h6>
                    </button>
                    <button onclick="deleteTask(${task.id})">
                        <h6>Delete</h6>
                    </button>
                </div>
            </div>
            `
        })

        taskList += `
        <div class="input-container">
            <input id="taskTitleInput" placeholder="Task title" />
            <input id="taskDescInput" placeholder="Description (optional)" />
            <select id="taskPriorityInput">
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
            </select>
            <button onclick="addTask()">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
        `
        main.innerHTML = taskList
    }

    async function toggleIsRegister() {
        isRegistration = !isRegistration
        usernameInput.style.display = isRegistration ? 'block' : 'none'
        registerBtn.innerText = isRegistration ? 'Sign in' : 'Sign up'
        document.querySelector('#auth > div h2').innerText = isRegistration ? 'Sign Up' : 'Login'
        document.querySelector('.register-content p').innerText =
            isRegistration ? 'Already have an account?' : "Don't have an account?"
    }

    async function authenticate() {
        const emailVal = email.value
        const passVal = password.value
        const usernameVal = usernameInput.value || emailVal.split('@')[0]

        if (isLoading || isAuthenticating || !emailVal || !passVal || passVal.length < 8 || !emailVal.includes('@')) {
            return
        }

        textError.style.display = 'none'
        isAuthenticating = true
        authBtn.innerText = 'Authenticating...'

        try {
            const endpoint = isRegistration ? 'auth/register' : 'auth/login'
            const body = isRegistration
                ? { username: usernameVal, email: emailVal, password: passVal }
                : { email: emailVal, password: passVal }

            const response = await fetch(apiBase + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            })

            const data = await response.json()

            if (!response.ok) {
                throw new Error(data.message || 'Authentication failed')
            }

            accessToken = data.accessToken
            refreshToken = data.refreshToken
            localStorage.setItem('accessToken', accessToken)
            localStorage.setItem('refreshToken', refreshToken)

            authBtn.innerText = 'Loading...'
            await fetchTasks()
            showDashboard()
        } catch (err) {
            textError.innerText = err.message
            textError.style.display = 'block'
        } finally {
            authBtn.innerText = 'Submit'
            isAuthenticating = false
        }
    }

    function logout() {
        if (refreshToken) {
            fetch(apiBase + 'auth/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refreshToken }),
            })
        }
        accessToken = null
        refreshToken = null
        tasks = []
        localStorage.removeItem('accessToken')
        localStorage.removeItem('refreshToken')
        authContent.style.display = 'flex'
        nav.style.display = 'none'
        header.style.display = 'none'
        main.style.display = 'none'
    }

    async function fetchTasks() {
        isLoading = true
        try {
            const response = await apiFetch('tasks')
            if (!response.ok) {
                logout()
                return
            }
            const data = await response.json()
            tasks = Array.isArray(data) ? data : []
        } catch (err) {
            console.log('fetchTasks error:', err.message)
        } finally {
            isLoading = false
        }
        renderTasks()
    }

    async function updateTask(id) {
        await apiFetch('tasks/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed: true }),
        })
        fetchTasks()
    }

    async function deleteTask(id) {
        await apiFetch('tasks/' + id, { method: 'DELETE' })
        fetchTasks()
    }

    async function addTask() {
        const title = document.getElementById('taskTitleInput').value
        const description = document.getElementById('taskDescInput').value
        const priority = document.getElementById('taskPriorityInput').value

        if (!title) return

        await apiFetch('tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title, description: description || undefined, priority }),
        })
        fetchTasks()
    }

    if (accessToken && refreshToken) {
        async function run() {
            await fetchTasks()
            if (accessToken) showDashboard()
        }
        run()
    }
</script>

</html>
